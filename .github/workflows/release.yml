name: Release

# Publishing needs npm auth for the @ruparupa scope. Two options:
#  1. Add repo secret NPM_TOKEN (npm Automation/Granular token with publish access).
#  2. Configure npm Trusted Publishing for these packages, then OIDC works.
# Until then this workflow is manual-only. After adding NPM_TOKEN, restore the
# `push: branches: [main]` trigger below so releases run automatically.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Opens/updates a "Version Packages" PR; publishes when that PR is merged.
      # `prepublishOnly` builds each package before `changeset publish`.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
